<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time to Decimal Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background: #4f46e5; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:hover { background: #4338ca; }
        .result { margin-top: 15px; font-size: 18px; font-weight: bold; color: #1f2937; }
    </style>
</head>
<body>

<div class="card">
    <h2>Oras to Decimal</h2>
    <label>Oras ng Simula (In)</label>
    <input type="time" id="timeIn" value="08:00">
    
    <label>Oras ng Tapos (Out)</label>
    <input type="time" id="timeOut" value="17:00">

    <label>Break (Oras)</label>
    <input type="number" id="breakTime" value="1" step="0.5">

    <button onclick="computeDecimal()">Kalkulahin</button>

    <div class="result" id="resultText">Resulta: 8.0 hrs</div>
</div>

<script>
function computeDecimal() {
    let inVal = document.getElementById('timeIn').value;
    let outVal = document.getElementById('timeOut').value;
    let breakVal = parseFloat(document.getElementById('breakTime').value) || 0;

    if (!inVal || !outVal) {
        alert("Mangyaring ilagay ang oras ng simula at tapos.");
        return;
    }

    let [inHour, inMin] = inVal.split(':').map(Number);
    let [outHour, outMin] = outVal.split(':').map(Number);

    let totalInMinutes = (inHour * 60) + inMin;
    let totalOutMinutes = (outHour * 60) + outMin;

    let diffMinutes = totalOutMinutes - totalInMinutes;
    if (diffMinutes < 0) diffMinutes += 24 * 60; // Kung lumagpas ng hating-gabi

    let totalHours = (diffMinutes / 60) - breakVal;
    if (totalHours < 0) totalHours = 0;

    document.getElementById('resultText').innerText = `Resulta: ${totalHours.toFixed(2)} hrs`;
}
</script>

</body>
</html>
